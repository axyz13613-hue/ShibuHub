name: Build Shibu Fingerprint APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ShibuFingerprintAnimation_Source.zip'
      - '.github/workflows/build-shibu-fingerprint.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf ShibuFingerprintAnimation
          unzip -q ShibuFingerprintAnimation_Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ShibuFingerprintAnimation
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShibuFingerprintAnimation-debug
          path: ShibuFingerprintAnimation/app/build/outputs/apk/debug/app-debug.apk
